# .github/workflows/tenancy-xref-lint.yml
# Lints the QBP federation tenancy doc for stale filesystem cross-references.
# QBP #433 — CI check that catches broken in-repo refs; #738 — verifies
# `expected-on-sibling`-annotated federation refs when the sibling is checked
# out (INFO "not verifiable here" on CI, where siblings are absent).
#
# Also hosts the Prediction-Classification gate (#736, re-filed from #170 AC4):
# every research/*_expected_results.md must carry a `## Prediction Classification`
# section whose Type column is Validation / Novel / OPEN only. Lives here rather
# than in a new workflow so pr-check-status.yml's workflow_run list is unchanged
# ("Tenancy XRef Lint" is already on it).
#
# Also hosts the #479 numeric-anchor lister self-test (scripts/list_numeric_anchors.py):
# the FORCED/SELECTED/UNDECIDED proposal's record-cited OVERRIDES are verified
# verbatim against the ledger, so a ledger edit that moves a quoted field fails
# here with the anchor named (fix = update the quote in OVERRIDES). Same
# placement rationale as #736.
name: "Tenancy XRef Lint"

on:
  push:
    branches:
      - master
    paths:
      - "docs/qbp-federation-tenancy.md"
      - "scripts/tenancy_xref_linter.py"
      - "scripts/test_tenancy_xref_linter.py"
      - ".github/workflows/tenancy-xref-lint.yml"
      - "research/**"
      - "scripts/check_prediction_classification.py"
      - "scripts/test_check_prediction_classification.py"
      - "scripts/list_numeric_anchors.py"
      - "scripts/test_list_numeric_anchors.py"
      - "archive/cth-inventory/confluent-trust-inventory-*.v0.3.json"
  pull_request:
    branches:
      - master
    paths:
      - "docs/qbp-federation-tenancy.md"
      - "scripts/tenancy_xref_linter.py"
      - "scripts/test_tenancy_xref_linter.py"
      - ".github/workflows/tenancy-xref-lint.yml"
      - "research/**"
      - "scripts/check_prediction_classification.py"
      - "scripts/test_check_prediction_classification.py"
      - "scripts/list_numeric_anchors.py"
      - "scripts/test_list_numeric_anchors.py"
      - "archive/cth-inventory/confluent-trust-inventory-*.v0.3.json"

jobs:
  tenancy-xref-lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Linter self-tests (#738 expected-on-sibling contract)"
        run: python3 scripts/test_tenancy_xref_linter.py

      - name: "Lint tenancy doc cross-references"
        run: python3 scripts/tenancy_xref_linter.py

  prediction-classification-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Gate: every research/*_expected_results.md carries Prediction Classification (#736)"
        run: python3 scripts/check_prediction_classification.py --list

      - name: "Gate self-test (adversarial docs must FAIL)"
        run: python3 scripts/test_check_prediction_classification.py

  numeric-anchor-lister-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "#479 lister: summary over the ledger (OVERRIDES quotes verified verbatim)"
        run: python3 scripts/list_numeric_anchors.py --summary

      - name: "#479 lister self-test (adversarial synthetic ledgers + real-ledger invariants)"
        run: python3 scripts/test_list_numeric_anchors.py
