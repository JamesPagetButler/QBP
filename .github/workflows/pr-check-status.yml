# PR check-status notifier + two-phase review trigger.
#
# Phase model (beekeeper-ratified design, 2026-06-04):
#
#   PR opened/synced ──► tier label auto-applied from changed paths (job: tier-label)
#   checks run       ──► TECH-GREEN: all checks green EXCLUDING review-completeness
#                        gates ──► `review-ready` label + review checklist posted
#                        (reviews are dispatched by the orchestrator; initiation is
#                        now mechanical, not memory)
#   reviews posted   ──► review gates turn green ──► ALL-GREEN + review-freshness
#                        check (patch-id) ──► MERGE-READY verdict (merge stays the
#                        beekeeper's call)
#   fix breaks CI    ──► RED verdict, `review-ready` REVOKED, cycle re-arms
#
# Review freshness: review/fix comments include a machine-readable marker
#   <!-- reviewed-sha: <full-sha> -->
# The ALL-GREEN verdict compares git patch-id of the last reviewed SHA vs head:
# identical patch-id (rebases / empty retrigger commits) keeps reviews fresh;
# a content change demands a delta round. No marker -> freshness UNVERIFIABLE
# (warned, not blocked — grandfathers pre-convention PRs).
#
# Why two thresholds: "trigger reviews when ALL checks pass" deadlocks — the
# tier-3 review-label gate is itself a check that stays red until reviews
# exist. TECH-GREEN excludes review gates; ALL-GREEN includes them.
#
# BOX CONTRACT (#507 §4, adopted from inter github-best-practices §2.2): a PR
# body's merge-blocking sign-off boxes live under a line containing
# "Sign-off required (merge-blocking)" or behind a `<!-- merge-blocking -->`
# sentinel, up to the next heading / "Informational" line / closing sentinel.
# ⊘ or ~~struck~~ lines are nil'd options, not undone work. ALL-GREEN with any
# such box unticked posts a NUDGE (🟡, not merge-ready) naming the boxes; it
# never ticks them. Parser: scripts/pr_merge_blocking_boxes.py (shared with the
# future required check — PR B, gated on the §7 beekeeper ruling).
# FAIL-CLOSED (federation rule R3, qbp-architecture §I4 on PR #731): a body with
# NO §2.2 region at all (neither form), or a parser that could not run, is "sign-off
# state not assessable" → 🟡, never ✅ ALL GREEN. The CI-green evidence box is
# still ticked (CI is green); only the headline verdict is withheld.
# MERGEABLE (#507 §6): ALL-GREEN also requires `gh pr view --json mergeable` !=
# CONFLICTING; a conflicting PR gets a resolve-first verdict instead.
#
# KNOWN LIMITATION: check_suite payloads carry an empty pull_requests[] for
# FORK PRs, so fork PRs get no verdict comment (acceptable: solo maintainer +
# agent sessions, same-repo branches only).

name: PR check-status notifier

# TRIGGER DESIGN (post-#508 live-test finding): check_suite:completed events
# from ACTIONS-CREATED suites never trigger workflows (GitHub's recursion
# guard) — on its first live PR the #508 notifier only fired on CodeQL's
# suites and structurally could not see the last Actions check finish.
# workflow_run:completed is the supported channel for Actions workflows; the
# check_suite trigger is kept for non-Actions apps (CodeQL etc.).
# MAINTENANCE: a NEW workflow added to the repo must be appended to the
# workflow_run list below, or its completion won't re-evaluate the verdict
# (a later-finishing unlisted workflow = missed final event). ENFORCED by
# `scripts/check_notifier_workflow_list.py` (#507 §3, job "notifier-workflow-list"
# in pr-process-lints.yml): every workflow with a pull_request trigger must be
# listed here; push/dispatch-only workflows are exempt by trigger.
on:
  workflow_run:
    workflows:
      - Lean Foundations Gate
      - CTH Schema Lint
      - Link Checker
      - CTH Anchor Impact
      - CI
      - Tier-3 Review Gate
      - Differential Test (Phase 4d)
      - Lint
      - Tenancy XRef Lint
      - Validate JSON
      - Closing-keyword AC guard
      - Agda Cubical (library-dependent, --safe)
      - Agda Substrate (Cubical type-check)
      - Inverse Anchor Audit
      - Pending-upgrade guard
      - PR Process Lints
      - Fano Snapshot Drift Guard
      - pa-reconcile
      - Closed-issue AC sweep tests
    types: [completed]
  check_suite:
    types: [completed]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: read

# CONCURRENCY (review round-1, Gemini blocking finding): the two jobs are
# separate AXES and must never share a cancellation group — a slow OLD-SHA
# suite completion firing notify could cancel a NEW-SHA tier-label run (the
# new commit would silently miss its tier classification). Job-level groups
# (below) separate the axes; within each axis, stale runs still cancel.
# (Job-level rather than event_name-keyed: after the workflow_run trigger fix,
# notify fires from TWO event types — event_name keying would let two notify
# instances race the comment upsert.)

jobs:
  # ── Phase 0: tier label from changed paths (instant, deterministic) ─────────
  tier-label:
    name: pr-tier-label
    if: ${{ github.event_name == 'pull_request' }}
    concurrency:
      group: pr-tier-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Classify tier from changed paths and apply label if absent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]')
          # never override a human/orchestrator tier choice
          if echo "$LABELS" | jq -e 'map(select(test("^tier-[123]-review$"))) | length > 0' > /dev/null; then
            echo "tier label already present — leaving as-is"; exit 0
          fi
          FILES=$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path')
          # theory-bearing globs mirror scripts/check_tier3_label.py THEORY_GLOBS
          TIER="tier-1-review"
          while IFS= read -r f; do
            case "$f" in
              proofs/*.lean|archive/cth-inventory/*.json|paper/*|docs/foundations/*)
                TIER="tier-3-review"; break ;;
              *.py|*.lean|*.yml|*.yaml|*.json|*.sh|*.toml|tests/*|scripts/*|proofs/*|src/*)
                TIER="tier-2-review" ;;
            esac
          done <<< "$FILES"
          gh pr edit "$PR" --repo "$REPO" --add-label "$TIER"
          echo "applied $TIER"

  # ── Phases 1–3: verdict + review-ready + merge-ready ────────────────────────
  notify:
    # IMPORTANT: this job name is the notifier's own check-run name; the query
    # below excludes it by name (self-counting fix, #508 review finding #1).
    name: pr-check-status-notify
    # Fire on any suite/run completion that carries a head SHA; the PR is
    # resolved via API inside the job. The event payload's pull_requests[] is
    # NOT trusted: GitHub populates it unreliably (observed empty for real
    # same-repo PR #512 → the notifier silently skipped a red verdict).
    if: ${{ github.event_name == 'check_suite' || github.event_name == 'workflow_run' }}
    concurrency:
      # group by SHA (PR number unavailable pre-resolution); same-PR pushes get
      # fresh groups per SHA — acceptable, the upsert is idempotent per comment
      group: pr-notify-${{ github.event.check_suite.head_sha || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # full history so patch-ids can be computed for both head and the
      # last-reviewed SHA (review-freshness check)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose and upsert verdict; manage review-ready label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.check_suite.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.check_suite.head_sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MARKER="<!-- pr-check-status-notifier -->"
          SELF="pr-check-status-notify"

          # PR resolution: payload first, API fallback (payload pull_requests[]
          # is unreliable — empty for real same-repo PRs; observed on #512).
          # EXACT head-SHA match only (review #517 blocking #1): the endpoint
          # returns every open PR whose branch CONTAINS the commit, so a loose
          # `first` can post the verdict to the wrong PR in stacked branches.
          # Verdicts are per-head — a SHA that heads no open PR gets none.
          if [ -z "${PR:-}" ]; then
            PR=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                 --jq '[.[] | select(.state == "open" and .head.sha == "'"$SHA"'")] | (first // {}) | .number // empty')
          fi
          if [ -z "${PR:-}" ]; then
            echo "no open PR headed by $SHA — nothing to do."
            exit 0
          fi
          # Stale-verdict guard (review #517 blocking #2): per-SHA concurrency
          # means an old-SHA run is not cancelled by a new push; without this
          # guard it could PATCH the marker comment with an outdated verdict
          # AFTER the correct one. If the PR head has advanced past our event
          # SHA, this run is history — exit.
          HEADNOW=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$HEADNOW" != "$SHA" ]; then
            echo "stale event: PR #$PR head is $HEADNOW, event SHA $SHA — exiting."
            exit 0
          fi
          echo "resolved PR #$PR for $SHA (current head)"
          # review-completeness gates excluded from TECH-GREEN (they cannot be
          # green before reviews exist — the deadlock this design dissolves).
          # Single source of truth for the excluded list:
          REVIEW_GATES='["Tier-3 review-label required on theory-bearing diffs"]'

          # Per-SHA check runs minus self (pagination: one array per page -> slurp+add),
          # then reduced to the LATEST check-run per name (#721 AC1).
          #
          # STALE-RUN CLASS: GitHub keeps EVERY historical check-run on a sha —
          # re-runs and concurrency `cancel-in-progress` casualties included — and
          # this endpoint returns them all (`filter=latest` is per-suite, not
          # per-name). Live case PR #733 head 2a61679 (2026-10-24): the Tier-3
          # gate had four runs on that sha — success 01:11, CANCELLED 01:12
          # (cancel-in-progress), success 01:28, success 03:38. Counting the
          # stale cancelled run made GATES_NFAIL=1 forever, so the verdict sat on
          # "Tech-green — review-ready" and never reached ALL-GREEN / never ticked
          # the CI-green evidence box, while `gh pr checks` (latest per name) was
          # all green. The same class keeps a PR RED on a cancelled early CI run.
          # Semantics: the raw API / GraphQL rollup lists every run (#733: 28
          # contexts), but `gh pr checks` and the merge box show only the newest
          # attempt per check identity — this reduction matches THOSE surfaces.
          # Identity = (name, app id), as the merge box groups; two Actions jobs
          # with the same display name in different workflows are therefore ONE
          # identity here, exactly as in `gh pr checks` (repo-level job names
          # must stay unique — tracked separately). Newest = started_at (the
          # newest ATTEMPT), id as tie-break (ids are monotonic). NOT completed_at: a
          # cancelled run's completed_at can postdate its replacement's started_at
          # (A started 01:11, B started 01:12:20, A cancelled 01:12:30), which
          # would mask B's in-progress state. PENDING below runs on the deduped
          # set, so an in-progress latest run still blocks.
          RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
                 --jq '[.check_runs[] | {name, status, conclusion, html_url, id, started_at, completed_at, app: .app.id}]' \
                 | jq -s 'add // [] | map(select(.name != "'"$SELF"'"))
                          | group_by([.name, .app]) | map(max_by([(.started_at // ""), .id]))')

          PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
          if [ "$PENDING" -gt 0 ]; then
            echo "$PENDING check(s) still running for $SHA — not posting yet."
            exit 0
          fi

          TECH=$(echo "$RUNS" | jq --argjson rg "$REVIEW_GATES" 'map(select(.name as $n | $rg | index($n) | not))')
          GATES=$(echo "$RUNS" | jq --argjson rg "$REVIEW_GATES" 'map(select(.name as $n | $rg | index($n)))')
          isfail='map(select(.conclusion as $c | ["failure","timed_out","cancelled","action_required"] | index($c)))'
          TECH_FAILED=$(echo "$TECH" | jq "$isfail")
          GATES_NFAIL=$(echo "$GATES" | jq "$isfail | length")
          NTECHFAIL=$(echo "$TECH_FAILED" | jq 'length')
          TOTAL=$(echo "$RUNS" | jq 'length')
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")

          add_label()    { gh pr edit "$PR" --repo "$REPO" --add-label    review-ready 2>/dev/null || true; }
          remove_label() { gh pr edit "$PR" --repo "$REPO" --remove-label review-ready 2>/dev/null || true; }

          # ── CI-green evidence-box self-tick (#507 §8a, FAULT-S4-002 fix) ──
          # The notifier owns the "CI green" EVIDENCE box on the PR body: tick at
          # ALL-GREEN, un-tick at RED. This removes the orchestrator/watcher
          # dependency that failed on #533 (a green CI whose box never got ticked
          # because the watcher tail short-circuited). Deterministic, idempotent.
          #
          # GUARDRAIL (bma#245 / box-keeper spec): touches ONLY a checkbox line
          # whose text contains "CI green"; the exclusion regex hard-blocks any
          # review / sign-off / Human-Visual-Review box. Evidence boxes only —
          # never a judgment box. Ticks at most ONE box (the first match).
          set_ci_box() {  # $1 = mark: "x" (tick) or " " (untick)
            local mark="$1" body newbody tmp
            body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body) || return 0
            newbody=$(printf '%s' "$body" | awk -v m="$mark" '
              BEGIN { done = 0 }
              {
                line = $0
                if (!done \
                    && line ~ /^[[:space:]]*-[[:space:]]\[[ xX]\]/ \
                    && tolower(line) ~ /ci green/ \
                    && tolower(line) !~ /review|sign.?off|visual|hvr|red team|gemini|approve/) {
                  sub(/\[[ xX]\]/, "[" m "]", line)
                  done = 1
                }
                print line
              }')
            if [ "$newbody" != "$body" ]; then
              tmp=$(mktemp)
              printf '%s' "$newbody" > "$tmp"
              gh pr edit "$PR" --repo "$REPO" --body-file "$tmp" 2>/dev/null \
                && echo "CI-green evidence box set to [$mark]" || true
              rm -f "$tmp"
            fi
          }

          # bodies via printf (YAML indentation inside literals renders as code blocks)
          if [ "$NTECHFAIL" -gt 0 ]; then
            # ── RED: revoke review-ready + withdraw CI-green evidence box ──
            remove_label
            set_ci_box " "
            LIST=$(echo "$TECH_FAILED" | jq -r '.[] | "- ❌ [\(.name)](\(.html_url)) — \(.conclusion)"')
            BODY=$(printf '%s\n## ❌ Checks FAILED — %s of %s @ %s\n\nHead: `%s`\n\n%s\n\n`review-ready` revoked: not reviewable until tech-green again. Machine-posted; updates per head SHA.' \
              "$MARKER" "$NTECHFAIL" "$TOTAL" "$TS" "$SHA" "$LIST")
          elif [ "$GATES_NFAIL" -gt 0 ]; then
            # ── TECH-GREEN: reviews owed ──
            add_label
            # QBP#706: tick the Red Team / Gemini rows from the SAME detected review
            # artifacts the Tier-3 gate uses, so this machine comment can never contradict
            # the record (PR #705 showed all-unticked boxes although every leg was ticked
            # with evidence in the PR body). Comments are joined by the gate's own boundary
            # and the detection runs from the trusted master checkout (scripts/), reusing
            # check_tier3_label's rule. A carried review (re-land case) counts like a fresh
            # one. The "Synthesis + fix rounds" row is dropped — it is not a gate.
            RT_BOX=" "; GM_BOX=" "
            CF=$(mktemp)
            gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate --jq '[.[].body]' \
              | jq -s 'add // []' | jq -r 'join("\n===TIER3-COMMENT-BOUNDARY===\n")' > "$CF" 2>/dev/null || : > "$CF"
            REVSTATE=$(python3 scripts/notifier_review_state.py --comments-file "$CF" 2>/dev/null || true)
            printf '%s\n' "$REVSTATE" | grep -q '^red_team=1' && RT_BOX="x"
            printf '%s\n' "$REVSTATE" | grep -q '^gemini=1'   && GM_BOX="x"
            rm -f "$CF"
            BODY=$(printf '%s\n## 🟢 Tech-green — review-ready @ %s\n\nHead: `%s`. All non-review checks pass; review-completeness gates await artifacts.\n\n**Review checklist** — mirrors detected review artifacts; the PR body is the record. Each review post must include `<!-- reviewed-sha: %s -->`:\n- [%s] Red Team review (Sabine/Grothendieck/Knuth)\n- [%s] Gemini review (Furey/Feynman, real API)\n- [ ] Human Visual Review (beekeeper)\n\nMachine-posted; updates per head SHA.' \
              "$MARKER" "$TS" "$SHA" "$SHA" "$RT_BOX" "$GM_BOX")
          else
            # ── ALL-GREEN: tick the CI-green evidence box, then review-freshness ──
            # Every check (incl. review gates) passed → the "CI green" evidence
            # box is now machine-true. Review FRESHNESS is reported separately
            # below; it does not gate this box (CI-green ≠ reviews-fresh).
            set_ci_box "x"
            # ── #507 §6: merge-ready must mean ONE-CLICK ──
            # A CONFLICTING PR is CI-green but not merge-ready: three sibling
            # aggregator-import PRs were each stamped merge-ready and the last
            # surfaced its conflict at the beekeeper's click (#520). Resolve BEFORE
            # the beekeeper queue. UNKNOWN = GitHub still computing; reported as such.
            MERGEABLE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq .mergeable 2>/dev/null || echo UNKNOWN)
            # ── #507 §4: box-state nudge (auto-nudge, never auto-tick) ──
            # Unticked MERGE-BLOCKING sign-off boxes per github-best-practices §2.2
            # ("Sign-off required (merge-blocking):" region or <!-- merge-blocking -->
            # sentinel; ⊘/struck lines are nil'd options, not undone work). Parser:
            # scripts/pr_merge_blocking_boxes.py — the ONE parser shared with the
            # future required check (PR B, gated on the #507 §7 beekeeper ruling).
            BODYFILE=$(mktemp)
            gh pr view "$PR" --repo "$REPO" --json body --jq .body > "$BODYFILE" || true
            # Fail-closed (R3): the parser's first line also carries `region=present|absent`;
            # a missing/erroring parser (notifier runs from the default branch, so the
            # script is absent until this lands) yields `region=unknown`. Anything other
            # than `present` withholds the ✅ verdict below.
            BOXES=$(python3 scripts/pr_merge_blocking_boxes.py --body-file "$BODYFILE" 2>/dev/null || echo "unticked=0 ticked=0 nil=0 region=unknown")
            NUNTICKED=$(printf '%s\n' "$BOXES" | sed -n 's/^unticked=\([0-9]*\).*/\1/p')
            REGION=$(printf '%s\n' "$BOXES" | sed -n 's/^unticked=.*region=\([a-z]*\).*/\1/p')
            UNTICKED_LIST=$(printf '%s\n' "$BOXES" | sed -n 's/^UNTICKED: /- ⏸ /p')
            rm -f "$BODYFILE"
            : "${NUNTICKED:=0}"
            : "${REGION:=unknown}"
            LASTREV=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
                      --jq '[.[] | .body]' | jq -s 'add // []' \
                      | jq -r '[.[] | capture("<!-- reviewed-sha: (?<s>[0-9a-f]{7,40}) -->").s] | last // empty')
            # NOTE: FRESH strings are built with single-quoted printf formats
            # ONLY — markdown backticks inside double-quoted bash are command
            # substitution (the exit-127 incident: bash tried to EXECUTE
            # `reviewed-sha` at the notifier's first live ALL-GREEN).
            FRESH=$(printf '⚠️ review freshness UNVERIFIABLE — no `reviewed-sha` marker found in review comments; confirm reviews cover this head before merging.')
            if [ -n "$LASTREV" ]; then
              if [ "$LASTREV" = "$SHA" ]; then
                FRESH=$(printf '✔️ reviews stamped for this exact head.')
              else
                # patch-id comparison: identical content (rebase / empty
                # retrigger commits) keeps reviews fresh; content change
                # demands a delta round. Stable patch-id ignores hunk offsets.
                BASEREF=$(gh pr view "$PR" --repo "$REPO" --json baseRefName --jq .baseRefName)
                git fetch -q origin "$BASEREF" "$SHA" "$LASTREV" 2>/dev/null || true
                pid() { git diff "$(git merge-base "origin/$BASEREF" "$1")".."$1" 2>/dev/null \
                        | git patch-id --stable | cut -d' ' -f1; }
                P_HEAD=$(pid "$SHA" || echo head-err)
                P_REV=$(pid "$LASTREV" || echo rev-err)
                if [ -n "$P_HEAD" ] && [ "$P_HEAD" = "$P_REV" ]; then
                  FRESH=$(printf '✔️ reviews stamped for `%s`; patch-id identical to head (cosmetic motion only — rebase/retrigger). Reviews remain fresh.' "$LASTREV")
                else
                  FRESH=$(printf '🔶 **DELTA ROUND REQUIRED** — reviews stamped for `%s` but the diff content has changed since (patch-id mismatch). Do not merge on these reviews.' "$LASTREV")
                fi
              fi
            fi
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              # §6: CI green, but NOT merge-ready — resolve-first, orchestrator's job
              BODY=$(printf '%s\n## 🟡 CI GREEN but CONFLICTING — resolve first, NOT merge-ready — `%s` checks @ %s\n\nHead: `%s`\n\n%s\n\n⚠️ GitHub reports `mergeable: CONFLICTING` against the base branch. The orchestrator rebases/resolves and pushes BEFORE this PR enters the beekeeper queue (#507 §6; the #520 incident). Reviews stay valid if the patch-id survives the rebase.\n\nMachine-posted; canonical "CI green" evidence link. Merge remains the beekeeper'"'"'s call.' \
                "$MARKER" "$TOTAL" "$TS" "$SHA" "$FRESH")
            elif [ "$NUNTICKED" -gt 0 ]; then
              # §4: CI green, sign-off boxes still open — nudge the named hands, do NOT escalate merge-ready
              BODY=$(printf '%s\n## 🟡 CI GREEN — %s merge-blocking sign-off box(es) unticked — NOT yet merge-ready — `%s` checks @ %s\n\nHead: `%s`\n\n%s\n\n**Open sign-off boxes (github-best-practices §2.2; the hand that owns each box ticks it — the notifier never does):**\n%s\n\nIf a posted APPROVE comment already covers a box, cite it and tick the box (auto-nudge, not auto-tick; #507 §4). Mergeable: `%s`.\n\nMachine-posted; canonical "CI green" evidence link. Merge remains the beekeeper'"'"'s call.' \
                "$MARKER" "$NUNTICKED" "$TOTAL" "$TS" "$SHA" "$FRESH" "$UNTICKED_LIST" "$MERGEABLE")
            elif [ "$REGION" != "present" ]; then
              # R3 fail-closed (qbp-architecture §I4 on #731): no §2.2 region (or no parser)
              # means the sign-off state was NOT assessed — withhold ✅, say why.
              REGION_HEAD=$(printf '§2.2 parser unavailable')
              if [ "$REGION" = "absent" ]; then
                REGION_HEAD=$(printf 'no §2.2 region in the PR body')
                REGION_NOTE=$(printf 'The PR body uses NEITHER §2.2 form, so merge-blocking sign-off boxes could not be assessed (reviewer boxes in any other shape are not read). Add a `Sign-off required (merge-blocking):` list or the `<!-- merge-blocking -->` sentinel (github-best-practices §2.2) and the notifier re-evaluates on the next head/edit.')
              else
                REGION_NOTE=$(printf 'The §2.2 box parser (`scripts/pr_merge_blocking_boxes.py`) was unavailable on the default-branch checkout, so merge-blocking sign-off boxes could not be assessed.')
              fi
              BODY=$(printf '%s\n## 🟡 CI GREEN — sign-off state not assessable: %s — NOT merge-ready — `%s` checks @ %s\n\nHead: `%s`\n\n%s\n\n%s\n\nMergeable: `%s`. Fail-closed per federation rule R3 (reject on absence); #507 §4.\n\nMachine-posted; canonical "CI green" evidence link. Merge remains the beekeeper'"'"'s call.' \
                "$MARKER" "$REGION_HEAD" "$TOTAL" "$TS" "$SHA" "$FRESH" "$REGION_NOTE" "$MERGEABLE")
            else
              BODY=$(printf '%s\n## ✅ ALL GREEN — merge-ready pending beekeeper — `%s` checks @ %s\n\nHead: `%s`\n\n%s\n\nMergeable: `%s` (§6: merge-ready means one-click). §2.2 region present (label line or `<!-- merge-blocking -->` sentinel); no unticked merge-blocking sign-off boxes in it (§4).\n\nMachine-posted; canonical "CI green" evidence link (evidence-first rule, `docs/workflows/review_tiers.md`). Merge remains the beekeeper'"'"'s call.' \
                "$MARKER" "$TOTAL" "$TS" "$SHA" "$FRESH" "$MERGEABLE")
            fi
          fi

          CID=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
                --jq "[.[] | select(.body | startswith(\"$MARKER\"))]" \
                | jq -s 'add // [] | (first // {}) | .id // empty' -r)
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" > /dev/null
            echo "updated comment $CID"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" > /dev/null
            echo "created comment"
          fi
      # Who watches the watcher: a notifier crash must never be silent (the
      # exit-127 incident produced no verdict and no visible signal anywhere
      # except a failed Actions run nobody was reading).
      - name: Report notifier failure on the PR
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.check_suite.head_sha || github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          # exact head-SHA match, same rule as the main resolver (review #517)
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" \
               --jq '[.[] | select(.state == "open" and .head.sha == "'"$SHA"'")] | (first // {}) | .number // empty' || true)
          [ -z "${PR:-}" ] && { echo "no PR to warn"; exit 0; }
          # single-quoted printf — no hand-escaped backticks anywhere (127 class)
          WARN=$(printf '⚠️ **pr-check-status notifier ERRORED** on `%s` — no verdict was posted for this head. Check the run: %s. Do not trust any older verdict comment above.' "$SHA" "$RUN_URL")
          gh pr comment "$PR" --repo "$REPO" --body "$WARN" || true
