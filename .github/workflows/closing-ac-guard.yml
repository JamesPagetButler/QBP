# Guard against auto-closing an issue that still has unchecked acceptance criteria.
# FAULT-S4-004: `closes #474 AC2` closed the parent (GitHub ignores the "AC2").
# This fails the PR before merge so the author uses `Refs #N (satisfies ACn)`.
name: Closing-keyword AC guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  guard:
    name: no-close-with-unchecked-ACs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect PR body + commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""' > /tmp/prtext.txt
          # commit messages on the PR (closing keywords in commits also auto-close)
          gh api "repos/${REPO}/pulls/${PR}/commits" --jq '.[].commit.message' >> /tmp/prtext.txt
      - name: Enforce no-close-with-unchecked-ACs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_closing_acs.py --text-file /tmp/prtext.txt
