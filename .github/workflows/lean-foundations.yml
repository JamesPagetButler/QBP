# Lean foundations gate — issue #481.
#
# Enforces the foundations proof standard mechanically (it was human-discipline-only;
# FAULT-S4-001 + the archive octonionMul `True := by trivial` stub are what this prevents).
# Policy: inter/lean-proof-best-practices.md Rule 4 + docs/foundations/scope-deliberation-2026-05-31.md.
#
# Four jobs:
#   changes (always runs) — dorny/paths-filter decides whether any Lean-relevant path changed.
#   foundations-standard (fast, no toolchain; runs when changes.lean == true) — hard-ban native_decide +
#     `: True := by trivial`; ratchet sorry + vacuous-`: True :=` theorems against
#     proofs/QBP/Foundations/.lean-gate-baseline.json.
#   lake-build "lake build (compile)" (heavy; runs when changes.lean == true) — `lake build` with the
#     pinned toolchain + Mathlib cache; uploads the project's .olean output.
#   axiom-audit "lake build (zero errors)" — on a FRESH runner, fails unless the compile job succeeded,
#     then audits every built module (PR #829). This is the required status check on master (the
#     name required since 2026-09-21); when skipped (no Lean path changed) GitHub reports it satisfied.
#
# Same shape as cth-schema-lint.yml (PR #459): workflow + script + fail-on-violation.

name: Lean Foundations Gate

on:
  pull_request:


permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter lists the PR's files on pull_request events

jobs:
  changes:
    # Always runs. The two gate jobs below are skipped (which GitHub counts as passing for a
    # required check) when no Lean-relevant path changed. This replaces the workflow-level
    # `paths:` filter, which left non-Lean PRs stuck at "Expected" once `lake build (zero
    # errors)` became a required check on master (2026-09-21).
    name: Detect Lean changes
    runs-on: ubuntu-latest
    outputs:
      lean: ${{ steps.filter.outputs.lean }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            lean:
              - 'proofs/**/*.lean'
              - 'proofs/lakefile.lean'
              - 'proofs/lean-toolchain'
              - 'proofs/lake-manifest.json'
              - 'proofs/QBP/Foundations/.lean-gate-baseline.json'
              - 'proofs/QBP/.build-visibility-quarantine.json'
              - 'scripts/check_lean_foundations.py'
              - 'scripts/lean_lexer.py'
              - 'scripts/test_check_lean_foundations.py'
              - 'scripts/gen_lean_axiom_audit.py'
              - 'scripts/check_lean_axiom_audit.py'
              - 'scripts/test_lean_axiom_audit.py'
              - 'scripts/lean_axiom_allowlist.json'
              - 'scripts/LeanAxiomAudit.lean'
              - 'scripts/lean_audit_fixtures/**'
              - 'scripts/lean_lexer_fixtures/**'
              - 'scripts/check_layer_imports.py'
              - 'scripts/test_check_layer_imports.py'
              - '.github/workflows/lean-foundations.yml'

  # Fail-closed gating (#674, beekeeper ruling 2026-10-27). Every job that `needs: changes`
  # uses the form:  if: ${{ !cancelled() && (needs.changes.result != 'success' || <output> == 'true') }}
  # (`${{ }}` is required: a bare leading `!` is a YAML tag. `!cancelled()` rather than `always()`
  # per GitHub's own guidance: `always()` would start every gate job into a run a human cancelled.)
  #
  #   changes.result | <output>  | gated job
  #   ---------------+-----------+-----------
  #   success        | 'true'    | RUNS   (relevant path changed)
  #   success        | 'false'   | SKIPS  (filter answered "no relevant change")
  #   failure        | (unset)   | RUNS   (filter broke -> do not trust the skip)
  #   cancelled      | (unset)   | does not start — a job is only cancelled when the whole run is,
  #                  |           | and a cancelled run never satisfies a required check (still fail-closed)
  #
  # A skipped job satisfies a required status check, so without the `result != 'success'` leg a broken
  # dorny/paths-filter step would silently pass the gate (Red Team F2 on PR #673).
  foundations-standard:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lean == 'true') }}
    name: Foundations standard (no-sorry-increase / no native_decide / no vacuous stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Enforce the foundations proof standard
        run: python3 scripts/check_lean_foundations.py --dir proofs/QBP/Foundations
      - name: Self-test the foundations lexer (planted "/-" string, nested comments, interpolation)
        run: python3 scripts/test_check_lean_foundations.py
      - name: Enforce layer-import DAG + aggregator + build-visibility completeness
        run: python3 scripts/check_layer_imports.py
      - name: Self-test the layer-import gate (adversarial build-invisibility plant)
        run: python3 scripts/test_check_layer_imports.py


  lake-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lean == 'true') }}
    # Compiles the project. The REQUIRED check "lake build (zero errors)" is the axiom-audit job
    # below, which fails unless this job succeeded (PR #829 Red Team r2 finding 1).
    name: lake build (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install elan (pinned toolchain from proofs/lean-toolchain)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat proofs/lean-toolchain | sed 's#leanprover/lean4:##')"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache (avoid building Mathlib from source)
        working-directory: proofs
        # GH_TOKEN authenticates the cache's GitHub API calls. Unauthenticated,
        # the runner shares a 60-req/hr limit that heavy CI days exhaust -> the
        # API returns a rate-limit body instead of a release tag -> the opaque
        # "failed to parse latest release tag" error (root cause of #531's
        # cache-fetch failures: earlier PRs passed, later ones failed as quota
        # drained). Authenticated = 5000/hr, so it does not exhaust.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lake exe cache get || echo "::warning::lake exe cache get incomplete — build may compile more from source"
      # Pre-run resource estimate (workspace hard gate `pre-run-resource-estimate`; QBP#633):
      # the per-module peak-RSS table lives in docs/foundations/lean-build-resource-notes.md.
      # The one Foundations module with a measured peak so far (see that table): Octonion32Count,
      # 4.4–4.6 GiB standalone (was > 12 GiB, OOM-killed, before #633); the ubuntu-latest runner has 16 GB. A module that would push
      # a standalone `lean` above ~8 GiB needs a row in that table before it lands.
      - name: lake build
        working-directory: proofs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: lake build
      # The project's .olean files are the ONLY thing this job hands to the audit. Nothing else
      # produced here (no script, no binary, no path) reaches the grading job.
      - name: Upload the project build output (.olean files) for the audit job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proofs-build-lib
          path: proofs/.lake/build/lib/lean
          retention-days: 1
          if-no-files-found: error

  # AXIOM AUDIT (#827 AC2–AC4; replaces the old "#print axioms audit — no-op today" note from
  # #481), on a FRESH RUNNER (PR #829 Red Team r2 finding 1). Proof code runs during `lake build`
  # (`#eval`) and could plant tools on that runner's PATH (a fake `python3` in ~/.elan/bin made
  # the old in-job gate print PASSED). So the gate runs here instead, and here NO project Lean
  # code runs:
  #   * fresh checkout: the gate scripts, the auditor and the allowlist come from the PR's own
  #     checkout in THIS job, never from the build job;
  #   * the toolchain is the release tarball named below, verified against its SHA-256, and
  #     called by absolute path; Python is /usr/bin/python3; no `lake` runs on the project (the
  #     search path is written from the artifact layout, not from `lake env`);
  #   * Mathlib comes from its own pinned commit and cache (`lake exe cache get` inside the
  #     Mathlib checkout runs Mathlib's code, never the project's lakefile);
  #   * the build job hands over only its .olean output. The .olean data is the one stated
  #     trust (no kernel re-check here; that is lean4checker's job).
  # The pins below must equal proofs/lean-toolchain and the lakefile's Mathlib pin (checked).
  # Lean enumerates EVERY constant of every project module the default roots really load and
  # computes its exact axiom closure; anything outside the toolchain's {propext,
  # Classical.choice, Quot.sound} fails. EVERY .olean of the build output must be audited, or
  # the job fails. THE ONLY EXCEPTION: scripts/lean_axiom_allowlist.json (issue #582, two
  # identity-pinned entries; any dependent fails — the gate is transitive).
  axiom-audit:
    needs: [changes, lake-build]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lean == 'true') }}
    # The required status check on master (since 2026-09-21) is named "lake build (zero errors)".
    # This job carries that name and fails unless the compile job succeeded, so the required
    # check now means: the project builds AND its axiom audit passes.
    name: lake build (zero errors)
    runs-on: ubuntu-latest
    env:
      LEAN_RELEASE: v4.30.0
      LEAN_TARBALL_SHA256: 4dad74141c2c119ca1aa626656be83b8e14238afba97271fd7bf1eb3f081b319
      MATHLIB_REV: c5ea00351c28e24afc9f0f84379aa41082b1188f
    steps:
      - name: The compile job must have succeeded
        run: |
          if [ "${{ needs.lake-build.result }}" != "success" ]; then
            echo "::error::lake build (compile) did not succeed (${{ needs.lake-build.result }})"; exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The workflow's pins equal the PR's toolchain and Mathlib pins
        run: |
          set -euo pipefail
          tc="$(/usr/bin/cat proofs/lean-toolchain)"
          [ "$tc" = "leanprover/lean4:$LEAN_RELEASE" ] || { echo "::error::proofs/lean-toolchain is '$tc', the audit job pins $LEAN_RELEASE — update both"; exit 1; }
          n="$(/usr/bin/grep -c "mathlib4.git\" @ \"$MATHLIB_REV\"" proofs/lakefile.lean || true)"
          [ "$n" = "1" ] || { echo "::error::proofs/lakefile.lean does not pin Mathlib to $MATHLIB_REV — update both"; exit 1; }
      - name: Install the pinned Lean release (SHA-256 verified)
        run: |
          set -euo pipefail
          v="${LEAN_RELEASE#v}"
          cd "$RUNNER_TEMP"
          /usr/bin/curl -sSfL -o lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/$LEAN_RELEASE/lean-$v-linux.tar.zst"
          echo "$LEAN_TARBALL_SHA256  lean.tar.zst" | /usr/bin/sha256sum -c -
          /usr/bin/tar --use-compress-program=/usr/bin/zstd -xf lean.tar.zst
          tcd="$RUNNER_TEMP/lean-$v-linux"
          "$tcd/bin/lean" --version
          echo "TC=$tcd" >> "$GITHUB_ENV"
      - name: Mathlib at its pinned commit, with its own cache (no project code)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          m="$RUNNER_TEMP/mathlib"
          /usr/bin/git init -q "$m"
          /usr/bin/git -C "$m" fetch -q --depth 1 https://github.com/leanprover-community/mathlib4.git "$MATHLIB_REV"
          /usr/bin/git -C "$m" checkout -q FETCH_HEAD
          [ "$(/usr/bin/git -C "$m" rev-parse HEAD)" = "$MATHLIB_REV" ]
          cd "$m" && PATH="$TC/bin:/usr/bin:/bin" "$TC/bin/lake" exe cache get
          echo "MATHLIB=$m" >> "$GITHUB_ENV"
      - name: Download the project build output (.olean files only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proofs-build-lib
          path: ${{ runner.temp }}/proj-lib
      - name: Axiom-audit self-test (planted fixtures, core Lean only)
        run: |
          set -euo pipefail
          PATH="$TC/bin:/usr/bin:/bin" /usr/bin/python3 -I scripts/test_lean_axiom_audit.py --lean "$TC/bin/lean"
      - name: Axiom audit (Lean enumerates every declaration of every built module)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/axiom-audit"
          proj="$RUNNER_TEMP/proj-lib"
          # The search path, written from the artifact layout (the auditor puts the toolchain
          # library FIRST): project output, Mathlib, Mathlib's dependencies.
          lp="$proj:$MATHLIB/.lake/build/lib/lean"
          for d in "$MATHLIB"/.lake/packages/*/.lake/build/lib/lean; do lp="$lp:$d"; done
          /usr/bin/python3 -I scripts/gen_lean_axiom_audit.py --proofs proofs --out-dir "$out" \
            --project-dir "$proj" --allowlist scripts/lean_axiom_allowlist.json
          for a in "$out"/AxiomAudit_*.args; do
            mapfile -t args < "$a"
            # LEAN_PATH unset: the auditor's own `import Lean` resolves to the toolchain only.
            # A failed run leaves no result line; the checker decides (fail-closed).
            (cd "$RUNNER_TEMP" && /usr/bin/env -u LEAN_PATH QBP_AUDIT_LEAN_PATH="$lp" \
              "$TC/bin/lean" --run "$GITHUB_WORKSPACE/scripts/LeanAxiomAudit.lean" "${args[@]}" \
              > "${a%.args}.out" 2> "${a%.args}.stderr") || true
            /usr/bin/tail -c 2000 "${a%.args}.stderr" || true
          done
          /usr/bin/python3 -I scripts/check_lean_axiom_audit.py --manifest "$out/manifest.json" \
            --allowlist scripts/lean_axiom_allowlist.json --build-dir "$proj"
