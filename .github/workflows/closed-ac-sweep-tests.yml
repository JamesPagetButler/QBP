# Unit tests for the #543 closed-issue AC sweep tool (report-only; FAULT-S4-004
# retroactive cleanup). Runs only when the tool, its test, or the forward guard
# it shares the box convention with changes.
name: Closed-issue AC sweep tests

on:
  pull_request:
    paths:
      - 'scripts/audit_closed_acs.py'
      - 'scripts/test_audit_closed_acs.py'
      - 'scripts/check_closing_acs.py'
      - '.github/workflows/closed-ac-sweep-tests.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/audit_closed_acs.py'
      - 'scripts/test_audit_closed_acs.py'
      - 'scripts/check_closing_acs.py'

permissions:
  contents: read

jobs:
  test:
    name: audit_closed_acs parser + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet pytest
      - run: python3 -m pytest scripts/test_audit_closed_acs.py -v
